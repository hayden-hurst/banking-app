name: Build & Push Docker Image

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
        ports:
            - 5432:5432

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Tests and build Spring Boot jar
      - name: Test and build with Maven
        run: mvn clean package "-Dtest='Test,*Tests,*IT"
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/postgres
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      # 6. Generate short commit SHA tag
      - name: Generate image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 7. Log into GitHub Container Registry (FIXED)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
          -t ghcr.io/${{ github.repository_owner }}/banking-backend:latest \
          -t ghcr.io/${{ github.repository_owner }}/banking-backend:${{ env.IMAGE_TAG }} \
          backend/

      # 9. Push Docker image tags
      - name: Push Docker images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/banking-backend:latest
          docker push ghcr.io/${{ github.repository_owner }}/banking-backend:${{ env.IMAGE_TAG }}